[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(rev)s_%%(slug)s
# The database URL is never stored here: alembic/env.py reads app.config.Settings
# (DATABASE_URL locally and in CI, CLOUD_SQL_INSTANCE + DB_* parts on Cloud Run).
# [alembic] values are %-interpolated (hence %%); the logging sections below are read raw
# by logging.config.fileConfig (hence a single %).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
